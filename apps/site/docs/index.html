<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/tot.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#08080a" />
    <title>TOT docs</title>
    <meta name="description" content="How TOT works: agents on your own Claude and ChatGPT plans, each with a mascot, a computer and a memory. What it does today, and what it doesn't yet." />
    <meta property="og:title" content="TOT docs" />
    <meta property="og:description" content="How TOT works, what it does today, and what it doesn't yet." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="TOT" />
    <meta property="og:image" content="%TOT_SITE_ORIGIN%/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Floating islands over a sea of clouds at night, beside the words: Hand it to the night shift." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="%TOT_SITE_ORIGIN%/og.jpg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,300..800;1,14..32,300..800&family=Geist+Mono:wght@400..600&display=swap" />
    <script>
      // Same theme rule as the app and the landing page (apps/web/src/lib/theme.ts), applied before first paint.
      (function () {
        var saved = null;
        try {
          saved = localStorage.getItem("tot-theme");
        } catch (e) {}
        var dark = saved === "dark" || (saved !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.toggle("dark", dark);
        document.querySelector('meta[name="theme-color"]').setAttribute("content", dark ? "#08080a" : "#ffffff");
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <!-- Absolute: the same file serves every /docs/<page> URL, so a relative path would resolve differently. -->
    <script type="module" src="/docs/main.tsx"></script>
  </body>
</html>
