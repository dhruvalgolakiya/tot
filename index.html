<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/tot.svg" />
    <!-- Add to Home Screen: TOT opens full screen with its own icon (module 07). -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="TOT" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#08080a" />
    <!-- Inter for the UI and headings, Geist Mono for code, served with the app (src/fonts.css).
         Inter's Latin file is on every screen: fetch it now, not once the stylesheet asks for it. -->
    <link rel="preload" href="/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin />
    <script>
      // Apply the saved theme before first paint, so there's no flash (see src/lib/theme.ts).
      (function () {
        var saved = null;
        try {
          saved = localStorage.getItem("tot-theme");
        } catch (e) {}
        var dark = saved === "dark" || (saved !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.toggle("dark", dark);
        document.querySelector('meta[name="theme-color"]').setAttribute("content", dark ? "#08080a" : "#ffffff");
      })();
    </script>
    <title>TOT</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
