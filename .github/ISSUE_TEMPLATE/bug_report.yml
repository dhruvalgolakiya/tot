name: Bug report
description: Something in TOT doesn't work as it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please don't paste tokens, keys, passwords or `.env` values. A security issue? Report it privately instead (see SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. …
        2. …
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Where
      multiple: true
      options:
        - Web app (npm run dev / npm start)
        - Mac app
        - iPhone app
        - Remote access from another device
        - Landing page or docs
  - type: input
    id: version
    attributes:
      label: Version
      description: The Mac app's version (TOT → About), or the commit you run from.
  - type: input
    id: environment
    attributes:
      label: Environment
      description: macOS version, Node version, and the provider and model the agent used.
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: The relevant part of the server's output (the Mac app's is in ~/Library/Logs/TOT/server.log), with secrets removed.
      render: text
